# よくある質問（FAQ）
# 項目を追記してプッシュするだけで、画面の「よくある質問」に反映されます。
# 書き方は README.md の「よくある質問（FAQ）の追加方法」を参照してください。
faqs:
  - id: attendance
    question: 出席はどうすれば完了しますか？
    answer: |
      Zoomへの参加と、チャットボットへの質問・感想の提出で完了します。
    keywords: [出席, 出欠, 出席できた, 出席になる]
  - id: how-to-write
    question: 感想はどのように書けばよいですか？
    answer: |
      感想の書き方にルールはありません。
      質問でも感想でも、感じたことを自由に記入してください。
    keywords: [感想の書き方, 感想はどう, 感想を書き込, どう書け, 何を書け, ここに書]
